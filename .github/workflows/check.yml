# The type check and unit tests, from source, on Node. Quick, so it runs on
# every pull request into main and every push to main, including a direct
# push that skipped a pull request.
#
# Compiling the binaries is build.yml's job, and runs far less often.

name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels an older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The install scripts run on developers' machines before anything else
      # is installed, so a syntax error in either breaks every install.
      # Parsing catches that here; release.yml runs them for real.
      - name: Parse the install scripts
        run: |
          sh -n install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
            "install.ps1 parses"'
