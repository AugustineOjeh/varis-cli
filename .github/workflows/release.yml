# Publishes a release when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Seven jobs, in order:
#   validate  The tag must look like v1.2.3 (or v1.2.3-rc.1) and point at a
#             commit already on main, so nothing unreviewed ships.
#   build     build.yml, with the version stamped in from the tag: tests,
#             all five binaries compiled, each smoke-tested on its own
#             platform. Nothing is released unless every one passes.
#   publish   Packs each binary into its own archive, writes SHA256SUMS,
#             and creates the GitHub release with notes generated from the
#             merged pull requests.
#   install   Runs install.sh or install.ps1 on each platform against the
#             release just published, and checks the installed varis
#             reports the tag's version. It runs after publishing because
#             the installers download from the release itself; if it fails,
#             mark the release as a pre-release and fix forward.
#   dracarys  Installs this release with the install script, runs
#             `varis dracarys --goddamnit` in a project varis init set up,
#             and checks nothing is left: binary, PATH line, config folder,
#             varis.json, or AGENTS.md. On macOS, Linux, and Windows.
#   packages  packages.yml: updates the Homebrew tap and the Scoop bucket
#             to this release, and installs from each. Full releases only:
#             a package manager must never get a pre-release.
#   upgrade   Installs the previous full release with the install script,
#             runs its `varis upgrade`, and checks it lands on this one, on
#             macOS, Linux, and Windows. Full releases only, since upgrade
#             follows the latest. Skipped while the previous release
#             predates varis upgrade (0.3.0), whose stub can't upgrade.
#
# A tag with a suffix, such as v0.2.0-rc.1, makes a pre-release. GitHub never
# marks a pre-release as latest, so the install script, `varis upgrade`, and
# the package managers, which all follow the latest release, skip it.
#
# The release assets, which the install scripts, Homebrew, and Scoop
# download by these exact names:
#   varis-darwin-arm64.tar.gz  varis-darwin-x64.tar.gz
#   varis-linux-x64.tar.gz     varis-linux-arm64.tar.gz
#   varis-windows-x64.zip      SHA256SUMS
# Each archive holds one file at its root: varis, or varis.exe on Windows.
# One archive per platform, so each machine downloads only its own, about
# half the size of the bare binary. tar keeps the executable bit, which a
# bare download loses.

name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the publish job may write, to create the release.
permissions:
  contents: read

# One release per tag at a time, and never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The full history, so the on-main check below can see main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag name ends up in a shell command, a file, and the release
      # title, so it must be exactly a version, nothing else.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag $TAG isn't a version. Use v1.2.3, or v1.2.3-rc.1 for a pre-release."
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag points at a commit that isn't on main. Merge first, then tag main."
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every binary build.yml uploaded, each in its own folder:
      # artifacts/varis-linux-x64/varis, and so on.
      - uses: actions/download-artifact@v8
        with:
          pattern: varis-*
          path: artifacts

      # One archive per platform, named for it, holding the binary under the
      # name developers run: varis, or varis.exe. Artifacts lose the
      # executable bit on upload, so it's set again before packing, and tar
      # keeps it from here on. Windows has no executable bit and expects a
      # zip. The macOS signature is part of the file, so it survives.
      - name: Pack the binaries and write checksums
        run: |
          mkdir release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            chmod +x "artifacts/varis-$target/varis"
            tar -C "artifacts/varis-$target" -cf - varis | gzip -9 >"release/varis-$target.tar.gz"
          done
          (cd artifacts/varis-windows-x64 && zip -9 -X ../../release/varis-windows-x64.zip varis.exe)

          # Unpack each archive again and compare it with the binary that
          # passed the smoke test, so a packing mistake can't ship.
          check="$(mktemp -d)"
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir "$check/$target"
            tar -C "$check/$target" -xzf "release/varis-$target.tar.gz"
            cmp "$check/$target/varis" "artifacts/varis-$target/varis"
            [ -x "$check/$target/varis" ]
          done
          unzip -q release/varis-windows-x64.zip -d "$check/windows-x64"
          cmp "$check/windows-x64/varis.exe" artifacts/varis-windows-x64/varis.exe

          cd release
          # sha256sum's own format, so `sha256sum -c` and
          # `shasum -a 256 -c` both check it as is.
          sha256sum varis-* >SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "varis $VERSION" \
            --generate-notes \
            "${prerelease[@]}"

  install:
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            shell: bash
          - runner: macos-15-intel
            shell: bash
          - runner: ubuntu-latest
            shell: bash
          - runner: ubuntu-24.04-arm
            shell: bash
          # Windows PowerShell 5.1, not PowerShell 7: it's what every
          # Windows machine has, and the older of the two.
          - runner: windows-latest
            shell: powershell
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Pins the installer to this release, since a pre-release is never
      # the latest.
      VARIS_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install with install.sh
        if: matrix.shell == 'bash'
        run: |
          sh install.sh
          installed="$("$HOME/.varis/bin/varis" --version)"
          echo "installed $installed"
          [ "$installed" = "$VARIS_VERSION" ]

      - name: Install with install.ps1
        if: matrix.shell == 'powershell'
        run: |
          .\install.ps1
          $installed = & "$HOME\.varis\bin\varis.exe" --version
          Write-Output "installed $installed"
          if ($installed -ne $env:VARIS_VERSION) { exit 1 }
          # The installer added the folder to the user's PATH.
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*\.varis\bin*") { exit 1 }

  packages:
    needs: [validate, install]
    if: ${{ !contains(needs.validate.outputs.version, '-') }}
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    # The deploy keys for the tap and the bucket.
    secrets: inherit

  upgrade:
    needs: [validate, install]
    if: ${{ !contains(needs.validate.outputs.version, '-') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      # The first release whose varis upgrade works. An older copy runs its
      # own, older command, which is the stub.
      FIRST_UPGRADABLE: "0.3.0"
    steps:
      - uses: actions/checkout@v7

      # The full release before this one: the newest that isn't this tag,
      # a draft, or a pre-release.
      - name: Find the previous release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq \
            "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"v$VERSION\")][0].tag_name // \"\"")"
          previous="${previous#v}"
          oldest="$(printf '%s\n%s\n' "$previous" "$FIRST_UPGRADABLE" | sort -V | head -1)"
          if [ -z "$previous" ] || { [ "$oldest" = "$previous" ] && [ "$previous" != "$FIRST_UPGRADABLE" ]; }; then
            echo "::notice::Skipping: the previous release (${previous:-none}) predates varis upgrade."
            echo "version=" >>"$GITHUB_OUTPUT"
          else
            echo "Upgrading from $previous to $VERSION."
            echo "version=$previous" >>"$GITHUB_OUTPUT"
          fi

      - name: Upgrade with install.sh's copy
        if: steps.previous.outputs.version != '' && runner.os != 'Windows'
        shell: bash
        env:
          VARIS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          sh install.sh
          [ "$("$HOME/.varis/bin/varis" --version)" = "$VARIS_VERSION" ]
          "$HOME/.varis/bin/varis" upgrade
          installed="$("$HOME/.varis/bin/varis" --version)"
          echo "now $installed"
          [ "$installed" = "$VERSION" ]

      - name: Upgrade with install.ps1's copy
        if: steps.previous.outputs.version != '' && runner.os == 'Windows'
        shell: powershell
        env:
          VARIS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          .\install.ps1
          $varis = "$HOME\.varis\bin\varis.exe"
          & $varis upgrade
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # This run also deletes the old binary the upgrade parked aside.
          $installed = & $varis --version
          Write-Output "now $installed"
          if ($installed -ne $env:VERSION) { exit 1 }
          if (Test-Path "$varis.old") { Write-Error "The parked varis.exe.old wasn't removed."; exit 1 }

  dracarys:
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      VARIS_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install, set up a project, and burn it all (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh
          varis="$HOME/.varis/bin/varis"
          grep -q "Added by the Varis installer" ~/.bashrc ~/.bash_profile ~/.zshrc ~/.profile 2>/dev/null

          # A project as varis init leaves it, without signing in.
          project="$(mktemp -d)"
          cd "$project"
          echo '{}' >varis.json
          printf '# Instructions for coding agents\n\n<!-- BEGIN VARIS: managed by varis init; edits here are replaced -->\n## Varis\n<!-- END VARIS -->\n' >AGENTS.md
          echo '@AGENTS.md' >CLAUDE.md
          mkdir -p ~/.config/varis

          "$varis" dracarys --goddamnit

          for gone in "$HOME/.varis" ~/.config/varis varis.json AGENTS.md CLAUDE.md; do
            if [ -e "$gone" ]; then echo "::error::$gone is still there"; exit 1; fi
          done
          if grep -q "Added by the Varis installer" ~/.bashrc ~/.bash_profile ~/.zshrc ~/.profile 2>/dev/null; then
            echo "::error::The PATH line is still in a startup file"; exit 1
          fi

      - name: Install, set up a project, and burn it all (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1
          $varis = "$HOME\.varis\bin\varis.exe"
          $project = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid())
          New-Item -ItemType Directory $project | Out-Null
          Set-Location $project
          Set-Content varis.json '{}'
          New-Item -ItemType Directory -Force "$env:APPDATA\varis" | Out-Null

          & $varis dracarys --goddamnit
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # The install folder and PATH entry go once varis has exited, from
          # a script that waits for it. Give it up to 60 seconds.
          for ($i = 0; $i -lt 60 -and (Test-Path "$HOME\.varis"); $i++) { Start-Sleep 1 }
          foreach ($gone in @("$HOME\.varis", "$env:APPDATA\varis", "varis.json")) {
            if (Test-Path $gone) { Write-Error "$gone is still there"; exit 1 }
          }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*\.varis\bin*") { Write-Error "The PATH entry is still there"; exit 1 }
